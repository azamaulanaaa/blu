# cargo-dist configuration: https://axodotdev.github.io/cargo-dist/
#
# Builds one archive per target below, each containing the `lepatch` binary plus
# the LICENSE and README, with a sha256 per archive and a combined `sha256.sum`.
# `mise run dist-plan` prints exactly what a release would produce.
#
# The target list is the single source of truth. dist resolves it into a build
# matrix at plan time, so the triples never appear in the release workflow and
# cannot drift out of sync with it. The cross-compilers for the non-host
# targets are installed by the workflow dist generates.

[workspace]
members = ["cargo:."]

[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
#
# Empty, so a release is archives only: no shell or PowerShell installer, no
# MSI, no Homebrew formula. That keeps a release to files a user can verify by
# hand against the published checksums, which is the property that matters for a
# tool whose whole job is to be trusted with a copy of your data. Adding
# `shell` and `powershell` later is a one-line change plus a regeneration.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# `.github/workflows/release.yml` is generated by dist and then hand-edited to
# gate publishing on the full CI suite, so its bytes never match a regeneration.
# Without this, every dist command — including `plan` and `generate` — refuses to
# run. Scoped to that one file, so anything else drifting still fails.
#
# The gate is protected by the `release-config` job in ci.yml, which fails if the
# `checks` job or the `needs:` entry goes missing, rather than by comparing
# generated output.
allow-dirty = ["ci"]
