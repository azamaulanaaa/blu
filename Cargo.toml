[package]
name = "lepatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# The bundled LICENSE is GPL-2.0 with the "or any later version" option.
license = "GPL-2.0-or-later"
description = "Content-defined-chunking backup tool with deduplicated, versioned snapshots"
readme = "README.md"
keywords = ["backup", "deduplication", "content-addressed", "incremental"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/azamaulanaaa/lepatch"
# The on-disk format is not stable yet, so this is not published to crates.io.
# Set `repository` alongside flipping `publish` when it is.
#
# `dist = true` is what keeps the binary releaseable while that is true: without
# it, `publish = false` hides the binary from cargo-dist and there is nothing to
# announce.
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "lepatch"
path = "src/bin/mod.rs"

[dependencies]
async-trait = "0.1.89"
bincode = "1.3.3"
blake3 = { version = "1.8.2", features = ["traits-preview"] }
clap = { version = "4.5.53", features = ["derive"] }
fastcdc = "3.2.1"
filetime = "0.2.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"

[features]
# Windows file identity, needed to detect hard links there.
experimental = []

[dev-dependencies]
tempfile = "3.27.0"

# Lint levels, declared here so that they apply to every build rather than only
# to the ones CI happens to set `RUSTFLAGS` on. A warning that only fails in CI is
# a warning nobody sees until after they have pushed.
[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
# `all` covers correctness, suspicious, style, complexity and perf. `pedantic`
# adds the stricter stylistic and documentation lints, which is what makes a
# fallible function state what it can fail with. `cargo` covers crate metadata
# and dependency hygiene, and pairs with the `[bans]` section of deny.toml.
all = "deny"
cargo = "deny"
pedantic = "deny"
# A backup that panics mid-run has lost the guarantee it was taking, so a failed
# invariant is an error to propagate rather than an `unwrap`. Both of these
# currently hold in library and binary code without a single exception; the
# `.clippy.toml` exemption for tests is what keeps the test suite readable.
unwrap_used = "deny"
expect_used = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

