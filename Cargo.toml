[package]
name = "blulib"
# Both benches are declared by hand below, because criterion is not a libtest
# harness. With auto-discovery left on, `benches/fixture.rs` — a module both
# benches include for its byte generator, not a target — would be built as a
# third benchmark and fail to link. Every target this package has is listed
# explicitly, so nothing is lost by saying so.
autobenches = false
# 0.2.0 introduced zstd compression, which changed the record format:
# `FORMAT_VERSION` is 2, and a store written by 0.1 is refused rather than
# misparsed. Anyone with an existing backup set re-takes it.
#
# 0.5.0 moves the *pack* format to 6 and changes no set format at all, so it asks
# nothing of anyone holding a backup: a pack is derived output, regenerated by
# re-running `blu pack`. See the README's "Formats" section, which is where
# the versions and the formats are both written down.
version = "0.10.0"
edition = "2024"
# Minimum supported Rust version.
#
# Kept at the latest stable. The crate ships as binaries and as a library, so
# almost nobody compiles it. The floor sets the toolchain a contributor needs.
#
# Kept at the latest stable. The chunker needs `gearhash`, which declares
# `rust-version` 1.87. The floor stays above it with room to spare.
rust-version = "1.98"
# The bundled LICENSE is GPL-2.0 with the "or any later version" option.
license = "GPL-2.0-or-later"
description = "Backup tool with content-defined chunking and deduplicated, versioned snapshots"
readme = "README.md"
keywords = ["backup", "deduplication", "content-addressed", "incremental"]
categories = ["command-line-utilities", "filesystem"]
repository = "https://github.com/azamaulanaaa/blu"
# The on-disk format is not stable yet. A release may refuse stores from an
# earlier one. The package still publishes to crates.io as `blulib`. The `blu`
# binary ships through cargo-dist archives.
#
# `dist = true` marks the binary for cargo-dist. Without it cargo-dist ships
# nothing.

[lib]
name = "blulib"
path = "src/lib.rs"

# The package publishes as `blulib`. `blu` is taken on crates.io. This block
# keeps the binary name as `blu`. Without it the binary takes the package name.
[[bin]]
name = "blu"
path = "src/main.rs"

[package.metadata.dist]
dist = true
# The GitHub Release refers to the app as `blu` (the binary users install),
# while the package stays `blulib` for crates.io (`blu` is taken there).
# This only changes release text; archive files stay `blulib-*` because
# cargo-dist names them after the package. A full `blu-*` rename needs
# a split `blu` binary package, which would move `src/main.rs` and the
# binary-dependent tests out of this package.
display-name = "blu"

[dependencies]
# The server behind `blu serve`.
#
# `default-features = false` drops compression and cookies.
# Compression is dropped because this crate already links `zstd 0.13`.
# Cookies are dropped because the API sets none.
#
# What actix adds to our own tokio requirement is `net`.
# The features unify, so there is no second runtime.
#
# `macros` is the only feature kept.
# The handlers are `#[get]` and `#[post]`.
actix-web = { version = "4.15", default-features = false, features = ["macros"] }
# The client half, for serve targets over `http://` and `https://`.
#
# `awc` is actix's own client, so it sits on the `actix-http` this crate already
# links and adds no second runtime and no second event loop.
#
# `default-features = false` drops compression and cookies.
# Compression is dropped because responses are JSON.
# Cookies are dropped because nothing sets them.
#
# `rustls-0_23-native-roots` is kept.
# The client speaks plain HTTP and verified HTTPS.
# It verifies against the operating system roots.
# It uses rustls with ring.
# It pulls no openssl and no cmake.
# It pulls no compiled-in Mozilla bundle.
#
# `blu serve` offers plain HTTP only.
# A client behind TLS still reaches it through plain HTTP.
# A client before a terminator reaches the terminator through HTTPS.
#
# What `awc` pulls unconditionally is `actix-tls` and `h2`.
# `actix-tls` carries the TLS connector here, not a shim.
#
# `h2` arrives with `awc`.
# `awc` declares `actix-http` with `http2` turned on and offers no
# feature to turn it off, and `actix-http`'s `http2` feature is `dep:h2`.
#
# It also arrives with RUSTSEC-2026-0258, which `cargo deny check advisories`
# denies and cannot be resolved.
# `h2 0.3.27` is the last release of the unmaintained 0.3 line.
# `actix-http 3.18` pins `h2 = "0.3.27"`, and the fix is in `0.4.16`.
# `blu serve` speaks HTTP/1.1 and neither end of the transfer uses `h2`,
# so the vulnerable code is never reached.
# That is an argument, not a mitigation.
# The advisory stays denied rather than ignored.
awc = { version = "3.8.2", default-features = false, features = ["rustls-0_23-native-roots"] }
blake3 = { version = "1.8.2", features = ["traits-preview"] }
clap = { version = "4.5.53", features = ["derive"] }
# **This one is a parser, and it is here because the alternative was worse.**
#
# `serde_json` is ALREADY a transitive runtime dependency of `actix-web` — it is in
# `Cargo.lock` under it, unconditionally, with the feature set this crate already
# uses. So naming it here adds **zero** crates to the graph. An earlier version of
# this comment claimed a hand-written parser was worth ~250 lines to avoid "a
# dependency plus a CVE feed"; that was wrong, because the dependency and its
# advisories were already being shipped in the binary. The graph argument did not
# hold and has been deleted rather than softened.
#
# What remains true, and what still governs the API boundary:
#
# * **No serde on this crate's own types.** `Job`, `Requested`, a set name and a
#   version are the library's contract, and a `#[derive(Serialize)]` on any of
#   them would put a JSON concern into the type other callers reason about.
#   So `src/serve/json.rs` still writes every response byte by hand.
# * **The on-disk format stays hand-encoded**, which is the rule the crate still
#   holds, and the one `bincode` was removed over.
#
# So: hand-written out, `serde_json` in. That is the honest split — the crate
# chooses its response bytes, and does not hand-roll a JSON grammar to avoid a
# crate it already links.
serde_json = "1.0"
# Address parsing for remote stores (`src/storage/remote.rs`).
#
# ALREADY a transitive dependency, through `actix-web` and `reqwest` — it is in
# `Cargo.lock` unconditionally, with the default features this crate uses. So
# naming it here adds **zero** crates to the graph, the same position
# `serde_json` takes above. What it buys over a hand-rolled split at `://` is
# the authority grammar: user info, ports, and IPv6 brackets, all rejected or
# split by a parser that has seen every malformed address before. Policy stays
# here: the scheme allowlist, the bucket shape, and the refusal of passwords
# in the address are this crate's rules, not the parser's.
url = "2.5"
# SIMD Gear hash for content-defined chunking (`src/simd_cdc.rs`).
#
# MIT OR Apache-2.0, both allowed by `deny.toml`.
# Zero runtime dependencies, so the graph grows by one crate.
# `SSE4.2`/`AVX2` on `x86_64` and `NEON` on `aarch64` dispatch at runtime,
# with a scalar fallback, so no `-C target-cpu` flag and no `dist` change.
gearhash = "0.1"
filetime = "0.2.29"
# Time text for version stamps (`src/metadata.rs`).
#
# UTC text is hand-rolled date math with no failure mode.
# Local text reads the system zone through this crate.
# Both use RFC 3339 so the two forms parse as each other.
# MIT OR Apache-2.0, both allowed by `deny.toml`.
jiff = "0.2"
# The streaming half of the server: the body of a ranged pack response, and the
# SSE stream behind `GET /v1/jobs/{id}/events`. `default-features = false`
# drops `async-await`, which nothing here needs because the handlers are
# `async fn` rather than manual `Future` chains.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# No serialisation crate, deliberately. The snapshot encoding is hand-written in
# `src/metadata/codec.rs`, and the record and pack encodings are hand-written
# beside it, so that no upstream's release cadence or security policy can decide
# whether a backup set is still readable. `bincode` was here once and was removed
# for exactly that reason — see `deny.toml` for the advisory that prompted it,
# and the note on `tests/paths.rs` for the abort `PathBuf`'s `Serialize` impl
# caused. `deny.toml` enables `unused-crate-dependencies`, so a crate that creeps
# back in is a failing check rather than a comment nobody reads.
# `time` is for `blu serve`: a job records when it started and finished, and
# the job registry retires them on an age.
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
# `registry` is on for one reason: `blu serve` installs a second layer on the
# subscriber so a running job's progress reaches a client even when `RUST_LOG`
# keeps it off the terminal. Composing two layers is what `registry` is.
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }
walkdir = "2.5.0"
# Record payloads are zstd frames, compressed on write and decompressed on read.
# The measured trade-off, on a 4 MB executable: 2.7x smaller at level 1 and
# 468 MB/s to compress. On content that is already entropy-coded — which is most
# of what a game ships as textures, audio and video — it gains nothing, and a
# payload that does not get smaller is stored raw rather than as a frame that is
# a few bytes larger than the bytes it replaced.
zstd = "0.13"
# OpenTelemetry. **`src/telemetry` is off unless the operator asks for it** —
# see that module's docs. What is in the graph is the SDK, not an exporter: no
# exporter is built, no exporter thread is started and no socket is opened unless
# `--telemetry` or `OTEL_EXPORTER_OTLP_ENDPOINT` says so.
#
# `metrics` is on for the instruments; `logs` is off on every crate, because
# nothing in this one bridges `tracing` events into OTel logs and carrying the
# signal API for a bridge that does not exist would be graph for nothing. Same
# reason for `internal-logs`: this crate keeps its diagnostics on `tracing`.
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
# `rt-tokio` is what makes an *asynchronous* OTLP client usable at all, and it
# is not a detail. Without it the batch processor drives the exporter on its own
# `std` thread with `futures_executor::block_on`, which has no tokio reactor:
# `tokio::spawn` and `tokio::time::sleep` inside the async reqwest client then
# panic on a thread nobody is watching, and the spans are lost with no error
# anywhere. With `rt-tokio` the batching task is spawned on the runtime `main`
# already runs, so the client's I/O is driven properly.
#
# `experimental_trace_batch_span_processor_with_async_runtime` is the other
# half, and it is the one that actually swaps the processor:
# `opentelemetry_sdk::trace::BatchSpanProcessor` is the thread-and-`block_on`
# one and is what `with_batch_exporter` builds, while the async processor lives
# in `span_processor_with_async_runtime` behind that feature. So this crate
# builds the async processor by hand, with the runtime named, rather than asking
# the builder for the batch one.
#
# Both are `experimental_*` features of the SDK. That is the honest cost of an
# async client inside an async process, and the alternative — the blocking
# client this dependency used to name — is a second runtime's worth of
# machinery whose threads exist only to be blocked on a socket.
#
# `experimental_metrics_periodicreader_with_async_runtime` is the **metrics half
# of the same argument**, and without it this crate's metric reader panics on
# every run that exports. The default `metrics::PeriodicReader` collects on its
# own `std` thread and calls `futures_executor::block_on` around the async OTLP
# client, which is a `reqwest` client underneath and needs a tokio reactor. That
# thread has no reactor, so the export panics with "there is no reactor running"
# and **the numbers are lost with no error anywhere and an exit code of 0** —
# the same silent loss the span exporter has, in the same place. The
# runtime-aware reader spawns its worker on the runtime `main` already runs.
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics", "rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
# Only the stable, non-experimental attribute constants, and only the three this
# crate actually writes: `service.name`, `service.version` and
# `process.executable.name`. `semconv_experimental` is off, so a naming change
# upstream cannot move an attribute out from under the resource.
opentelemetry-semantic-conventions = { version = "0.31", default-features = false }
# `default-features = false` drops `tracing-log` (this crate uses `tracing`
# directly and has no `log` records to forward) and `metrics` (the layer's
# metrics bridge, which would duplicate the instruments rather than feed them).
tracing-opentelemetry = { version = "0.32", default-features = false }
# **The exporter, and the whole of the TLS argument.**
#
# * `http-proto` sends OTLP over HTTP with protobuf bodies.
#   The JSON encoding would put `serde` on the wire for no benefit.
#   The gRPC encoding would pull a whole gRPC stack.
#   Protobuf over HTTP is what a collector accepts by default.
# * `reqwest-client` selects the asynchronous HTTP client.
#   A blocking client has no place inside an actix process.
# * `reqwest-rustls` enables TLS for the exporter.
#   The client speaks plain HTTP and verified HTTPS.
#   It verifies against the operating system roots.
#   It uses rustls with ring, not `aws-lc-rs`, which needs `cmake`.
#   It pulls no openssl and no compiled-in Mozilla bundle.
#
# The feature resolves to `reqwest`'s `rustls-tls-native-roots`.
# A collector is verified against the operating system store.
# An `https://` endpoint connects.
# An `http://` endpoint still connects.
# Nothing downgrades and nothing upgrades.
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-client", "reqwest-rustls"] }
# Keyed stores beyond `file://` (`src/storage/operator.rs`).
#
# Always built, so every build speaks `file://`, `sftp://`, `ftp://`,
# and `s3://`.
# Configuration still arrives through the environment.
# A missing endpoint or identity still fails before the first byte moves.
#
# The S3 transport speaks plain HTTP and verified HTTPS.
# It verifies against the operating system roots.
# It uses rustls with ring and no compiled-in Mozilla bundle.
# It pulls no system OpenSSL and no cmake.
# `ftp://` and `sftp://` never touch HTTP either way.
#
# `default-features = false` keeps unused layers out.
# Retry and timeout stay because a network fails mid-run.
# The tokio executor stays because the mirror awaits the operator on it.
opendal = { version = "0.59", default-features = false, features = ["services-memory", "services-s3", "services-ftp", "services-sftp", "executors-tokio", "layers-retry", "layers-timeout"] }
# HTTP transport for the operator above.
# The TLS transport in `src/storage/tls.rs` wraps it for HTTPS.
# Plain HTTP passes through.
# Verified HTTPS connects.
opendal-http-transport-reqwest = { version = "0.59", default-features = false }
# TLS transport for the operator (`src/storage/tls.rs`).
#
# rustls with ring and the operating system roots.
# No compiled-in Mozilla bundle.
# No system OpenSSL.
# No cmake from aws-lc.
# `hyper-util` drives the connections.
# `hyper-rustls` wraps them in TLS.
# `rustls-native-certs` loads the system roots.
# `http`, `http-body` and `bytes` move the bytes.
bytes = { version = "1" }
http = { version = "1" }
http-body-util = { version = "0.1" }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = { version = "0.8" }

[features]
# Windows file identity, needed to detect hard links there.
experimental = []
# DEPRECATED: network stores are always built now.
# This feature remains so old `--features remote` commands still resolve.
# It selects nothing.
# Use no feature flag for `sftp://`, `ftp://`, and `s3://`.
remote = []
# DEPRECATED: TLS for keyed stores is always built now.
# This feature remains so old `--features remote-tls` commands still resolve.
# It selects nothing.
# Every build speaks `http://` and verified `https://`.
remote-tls = []
# DEPRECATED: TLS for telemetry is always built now.
# This feature remains so old `--features telemetry-tls` commands still resolve.
# It selects nothing.
# Every build speaks `http://` and verified `https://`.
telemetry-tls = []

[dev-dependencies]
# `default-features = false` drops criterion's `plotters`, `rayon` and
# `cargo_bench_support`, taking 20 crates out of the graph — including every
# `wasm-bindgen` one, which exist to draw plots in a browser and are dead weight
# in a native build.
#
# What is given up is the HTML report and criterion's parallel sampling of
# independent benchmark functions. Neither is what a benchmark is *for* here: the
# regression verdict ("change: -12.3% ... has regressed") comes from the text
# output, and the code under test manages its own threads, so criterion sampling
# it in parallel would only measure the sampler. Add the features back if the
# plots are ever wanted.
criterion = { version = "0.7", default-features = false }
tempfile = "3.27.0"

# Criterion is not a libtest harness, so each bench target opts out of it.
[[bench]]
name = "hotpath"
harness = false

[[bench]]
name = "throughput"
harness = false

# Benchmarks are the one place a number gets compared against a previous run, so
# the profile they are built with is part of the measurement.
#
# `codegen-units = 1` because cross-crate inlining is exactly what makes a
# backup pipeline's throughput move around between runs otherwise. It costs
# compile time, and only on `cargo bench`.
[profile.bench]
inherits = "release"
codegen-units = 1
# Symbols, so a benchmark that turns out to be slow can be profiled.
debug = true

# Lint levels, declared here so that they apply to every build rather than only
# to the ones CI happens to set `RUSTFLAGS` on. A warning that only fails in CI is
# a warning nobody sees until after they have pushed.
[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[lints.clippy]
# `all` covers correctness, suspicious, style, complexity and perf. `pedantic`
# adds the stricter stylistic and documentation lints, which is what makes a
# fallible function state what it can fail with. `cargo` covers crate metadata
# and dependency hygiene, and pairs with the `[bans]` section of deny.toml.
all = "deny"
cargo = "deny"
pedantic = "deny"
# A backup that panics mid-run has lost the guarantee it was taking, so a failed
# invariant is an error to propagate rather than an `unwrap`. Both of these
# currently hold in library and binary code without a single exception; the
# `.clippy.toml` exemption for tests is what keeps the test suite readable.
unwrap_used = "deny"
expect_used = "deny"

# One lint is relaxed, deliberately and narrowly.
#
# `awc` pulls a second `rand`, and `actix-tls` wants `http 1.x` where this crate
# is on `http 0.2` through actix-web.
# Neither is avoidable by a feature choice.
#
# **The OpenTelemetry dependency adds six more duplicate pairs, and it does bring
# `hyper` into the graph.**
# `http-proto` reuses tonic's generated message types, so `tonic`
# arrives with its `tower` and `hyper` whether or not any gRPC is spoken.
# The async OTLP client is `reqwest`, which is a `hyper` client underneath.
# TLS comes from rustls with ring and system roots.
# `h2` is still the only unmaintained crate the advisory check has to ignore.
#
# `allow`, and the reporting moves to `deny.toml`, which is where it already was.
#
# `warn` looks like the middle course and is not: CI runs clippy with
# `-- -D warnings`, which promotes this back to an error, so `warn` is `deny` with
# extra steps. `allow` is the only level that survives that flag.
#
# Nothing is lost. `[bans] multiple-versions = "warn"` in deny.toml reports every
# one of these, and CI runs `cargo deny check bans` in its own job, so the count
# stays visible on every build -- in the tool whose job that is, rather than in a
# clippy lint that duplicates it and would need a second suppression.
#
# It is a table rather than an inline `multiple_crate_versions = "warn"` because a
# bare lint and a lint group both sit at priority 0, and Cargo refuses that
# ambiguity outright. Cargo applies lints in increasing priority order, so
# `priority = 1` is what puts this entry AFTER the `cargo` group and lets it win.
# Every other lint in that group stays denied.
[lints.clippy.multiple_crate_versions]
level = "allow"
priority = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

