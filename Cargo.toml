[package]
name = "lepatch"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[[bin]]
name = "main"
path = "src/bin/mod.rs"

[dependencies]
async-trait = "0.1.89"
bincode = "1.3.3"
blake3 = { version = "1.8.2", features = ["traits-preview"] }
clap = { version = "4.5.53", features = ["derive"] }
fastcdc = "3.2.1"
filetime = "0.2.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"

[features]
# Windows file identity, needed to detect hard links there.
experimental = []

[dev-dependencies]
tempfile = "3.27.0"

# Lint levels. Denying the groups below means a regression fails CI rather than
# waiting to be noticed in review.
[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Restore used to open a file with `create` and no stated truncate behaviour,
# which is how a shorter file inherited the tail of a longer one.
suspicious_open_options = "deny"
# A backup has to be able to say which file it could not read.
missing_errors_doc = "allow"

