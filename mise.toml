# Toolchain and task aliases, so every check is one word and the versions are
# pinned in one place:
#
#   mise install     # fetch the tools below
#   mise run check   # everything
#
# Tasks mirror the CI jobs one-for-one, so anything CI enforces can be run
# locally with the same name and the same arguments.

[tools]
rust = { version = "stable", components = "rust-analyzer" }
# Coverage: llvm-cov instruments the test binary rather than sampling, so the
# numbers are exact and reproducible.
"cargo:cargo-llvm-cov" = "latest"
# Advisories, licences and duplicate-version checks over the resolved graph.
"cargo:cargo-deny" = "latest"
# Release artifacts: builds the platform archives and drives the release CI.
"cargo:cargo-dist" = "latest"

[tasks.build]
run = "cargo build --all-targets --all-features"

[tasks.test]
run = "cargo test --all-targets --all-features"

[tasks.cov]
run = "cargo llvm-cov --all-features --summary-only"
description = "Print a coverage summary for the test suite"

[tasks.cov-html]
run = "cargo llvm-cov --all-features --html --open"
description = "Write an HTML coverage report and open it"

[tasks.fmt]
run = "cargo fmt --all --check"

[tasks.clippy]
run = "cargo clippy --all-targets --all-features"

# The lint levels live in Cargo.toml under `[lints]`, so a bare `cargo clippy`
# already fails on a violation. `-D warnings` additionally covers the lint
# groups' own warnings and anything rustc emits outside the declared set.
[tasks.lint]
depends = ["fmt", "clippy"]

[tasks.licenses]
run = "cargo deny check licenses"
description = "Every locked dependency's licence must be compatible with GPL-2.0-or-later"

[tasks.advisories]
run = "cargo deny check advisories"
description = "Known vulnerabilities and yanked releases in the resolved graph"

[tasks.bans]
run = "cargo deny check bans"
description = "Wildcard dependencies, duplicate versions and unused crates"

[tasks.deps]
depends = ["licenses", "advisories", "bans"]

# Fails if the real floor has drifted above `rust-version` in Cargo.toml. Needs
# the toolchain once: rustup toolchain install 1.85
# The floor is read out of the manifest rather than written here, because the two
# drifting apart is the one failure this task cannot detect: a stale pin would
# keep testing a toolchain nobody claims to support while `rust-version` said
# something else.
[tasks.msrv]
run = '''
floor=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
echo "building against the declared floor: $floor"
cargo "+$floor" check --all-targets --all-features --locked
'''
description = "Build against the declared minimum supported Rust version"

[tasks.doc]
run = "cargo doc --no-deps --all-features"
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks.check]
depends = ["lint", "test", "deps", "msrv", "doc", "dist-check"]
description = "Run every check CI runs"

# ---------------------------------------------------------------------------
# Releases, via cargo-dist.
# ---------------------------------------------------------------------------

[tasks.dist-plan]
run = "dist plan"
description = "List the artifacts a release would produce, without building"

[tasks.dist-check]
run = "dist plan --output-format=human > /dev/null"
description = "Check that the release plan resolves and the release workflow still gates on CI"

[tasks.dist-generate]
run = "dist generate"
description = """
Regenerate .github/workflows/release.yml from dist-workspace.toml.

Then re-apply the two local edits the header of that file describes: the
`checks` job, and `checks` in the `needs:` of `build-local-artifacts`.
"""

[tasks.dist-build]
run = "dist build --artifacts=local --target=\"$(rustc -vV | sed -n 's/^host: //p')\""
description = """
Build the release archive for this machine into target/distrib.

Only the host triple: macOS and Windows artifacts need their own runners, which
is what the release workflow's matrix is for. Use `dist plan` to see the full
set a tag would produce.
"""

# ---------------------------------------------------------------------------
# Benchmarks.
#
# Two tools, because they answer different questions and only one of them is
# trustworthy on a shared machine. `bench` for component costs and for ratios
# measured inside a single run; `bench-ab` for any before/after claim, where
# criterion's stored baseline is not to be trusted. See `examples/ab.rs`.
# ---------------------------------------------------------------------------

[tasks.bench]
run = "cargo bench"
description = """
Criterion benchmarks: component costs and the concurrency curve.

Good for "what does this cost" and for ratios between rows measured in the same
run. Do not trust its change-detection across runs on a shared machine — it
reports a 0.9% interval around numbers that then move 16% on the next run.
"""

[tasks.bench-ab]
run = "cargo run --release --example ab -- compare"
description = """
Interleaved backup throughput by concurrency, minimum of several rounds.

This is the one to quote. Interleaving means a slow patch from a neighbour lands
on every variant, and the minimum is the closest observation to the uncontaminated
cost — interference can only ever make a run slower. Reports its own
contamination ratio so a noisy machine is visible in the output.
"""
